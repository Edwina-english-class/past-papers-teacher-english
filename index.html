<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英語教甄考古題測驗系統 Pro版</title>
<style>
body{font-family:Arial,"Microsoft JhengHei",sans-serif;background:#f4f6f9;margin:0;padding:20px;color:#333}
.container{max-width:950px;margin:auto;background:#fff;padding:30px;border-radius:20px;box-shadow:0 4px 15px rgba(0,0,0,.08)}
h1{text-align:center;margin-bottom:10px}
#topbar{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:20px;font-size:14px}
select,button{padding:10px;border-radius:10px;border:1px solid #ccc;font-size:14px}
#questionBox{font-size:20px;line-height:1.7;margin:20px 0}
.option{display:block;width:100%;margin:10px 0;padding:15px;border:none;border-radius:12px;background:#eef2f7;font-size:17px;cursor:pointer;text-align:left}
.option:hover{background:#dde7f3}
.correct{background:#c8f7c5!important}
.wrong{background:#ffc9c9!important}
#result,#explanation{margin-top:20px;padding:15px;border-radius:12px;display:none}
#result{font-weight:bold}
#explanation{background:#f7f7f7;line-height:1.7}
#loading{text-align:center;font-size:18px;padding:40px}
#wrongBox{margin-top:30px;padding:15px;background:#fff4e5;border-radius:15px;display:none}
</style>
</head>
<body>
<div class="container">
<h1>英語教甄考古題測驗系統 Pro版</h1>
<div id="loading">題庫載入中，請稍候...</div>
<div id="quizArea" style="display:none;">
<div id="topbar">
<div id="stats">已做：0 題｜答對：0 題｜正確率：0%</div>
<div>
<select id="schoolFilter" onchange="applyFilter()">
<option value="all">全部題庫</option>
<option value="wrong">只做錯題</option>
</select>
<button onclick="nextQuestion()">換一題</button>
</div>
</div>
<div id="sourceTag"></div>
<div id="questionBox"></div>
<div id="optionsBox"></div>
<div id="result"></div>
<div id="explanation"></div>
<button id="nextBtn" onclick="nextQuestion()">下一題</button>
<div id="wrongBox"></div>
</div>
</div>
<script>
const BASE_URL='https://edwina-english-class.github.io/past-papers-teacher-english/';
const PAPERS=[
{file:'paper1.json',name:'英語教甄考古題1'},
{file:'paper2.json',name:'英語教甄考古題2'}
];
let allQuestions=[];
let filteredQuestions=[];
let currentQuestion=null;
let doneCount=0;
let correctCount=0;
let wrongQuestions=[];

function shuffleArray(arr){return [...arr].sort(()=>Math.random()-0.5);}

async function loadAllPapers(){
try{
const responses=await Promise.all(PAPERS.map(async p=>{
const res=await fetch(BASE_URL+p.file);
if(!res.ok) throw new Error(p.file+'載入失敗');
const data=await res.json();
return data.map(q=>({...q,_source:p.name}));
}));
allQuestions=responses.flat();
makeSchoolOptions();
filteredQuestions=allQuestions;
document.getElementById('loading').style.display='none';
document.getElementById('quizArea').style.display='block';
nextQuestion();
}catch(err){
document.getElementById('loading').innerHTML='載入失敗，請確認GitHub已上傳完整檔案';
console.error(err);
}
}

function makeSchoolOptions(){
const select=document.getElementById('schoolFilter');
const schools=[...new Set(allQuestions.map(q=>q.school).filter(Boolean))];
schools.forEach(s=>{
const op=document.createElement('option');
op.value=s;
op.textContent=s;
select.appendChild(op);
});
}

function applyFilter(){
const val=document.getElementById('schoolFilter').value;
if(val==='all') filteredQuestions=allQuestions;
else if(val==='wrong') filteredQuestions=wrongQuestions.length?wrongQuestions:allQuestions;
else filteredQuestions=allQuestions.filter(q=>q.school===val);
nextQuestion();
}

function updateStats(){
const rate=doneCount===0?0:Math.round(correctCount/doneCount*100);
document.getElementById('stats').textContent=`已做：${doneCount} 題｜答對：${correctCount} 題｜正確率：${rate}%`;
}

function nextQuestion(){
if(filteredQuestions.length===0) filteredQuestions=allQuestions;
currentQuestion=filteredQuestions[Math.floor(Math.random()*filteredQuestions.length)];
document.getElementById('sourceTag').textContent=`來源：${currentQuestion.school||currentQuestion._source||'—'}`;
document.getElementById('questionBox').innerHTML=`<b>第${currentQuestion.question_number}題：</b><br>${currentQuestion.question}`;
const optionsBox=document.getElementById('optionsBox');
optionsBox.innerHTML='';
shuffleArray(Object.entries(currentQuestion.options)).forEach(([key,val])=>{
const btn=document.createElement('button');
btn.className='option';
btn.innerHTML=`<b>${key}.</b> ${val}`;
btn.onclick=()=>checkAnswer(key,btn);
optionsBox.appendChild(btn);
});
document.getElementById('result').style.display='none';
document.getElementById('explanation').style.display='none';
document.getElementById('nextBtn').style.display='none';
}

function checkAnswer(selected,btn){
doneCount++;
const correct=currentQuestion.answer;
const buttons=document.querySelectorAll('.option');
buttons.forEach(b=>b.disabled=true);
buttons.forEach(b=>{if(b.innerHTML.includes(`<b>${correct}.`)) b.classList.add('correct');});
const resultDiv=document.getElementById('result');
if(selected===correct){
correctCount++;
btn.classList.add('correct');
resultDiv.textContent='✔ 答對了！';
resultDiv.style.background='#dff0d8';
}else{
btn.classList.add('wrong');
resultDiv.textContent=`✘ 答錯了！正確答案是 ${correct}`;
resultDiv.style.background='#f2dede';
if(!wrongQuestions.includes(currentQuestion)) wrongQuestions.push(currentQuestion);
}
resultDiv.style.display='block';
const explanation=currentQuestion.explanation||currentQuestion.grammar_explanation||'本題尚未提供解析。';
const expDiv=document.getElementById('explanation');
expDiv.innerHTML=`<b>解析：</b><br>${explanation}`;
expDiv.style.display='block';
document.getElementById('nextBtn').style.display='inline-block';
updateStats();
updateWrongBox();
}

function updateWrongBox(){
const box=document.getElementById('wrongBox');
if(wrongQuestions.length===0){box.style.display='none';return;}
box.style.display='block';
box.innerHTML=`<b>目前錯題累積：</b> ${wrongQuestions.length} 題（可從上方切換「只做錯題」複習）`;
}

loadAllPapers();
</script>
</body>
</html>
